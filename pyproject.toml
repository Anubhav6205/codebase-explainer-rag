[project]
name = "codebase-explainer-rag"
version = "0.1.0"
description = "Multi-agent RAG assistant that answers architecture questions about a codebase, with citations and abstention"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client",
    "voyageai",
    "llama-index-core",
    "fastembed",
    "langchain",
    "langchain-openai",
    "langchain-core",
    "langchain-text-splitters",
    "langgraph",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic",
    "ragas",
    "datasets",
    "arize-phoenix",
    "arize-phoenix-otel",
    "openinference-instrumentation-langchain",
    "sentence-transformers",
    "tree-sitter",
    "tree-sitter-language-pack",
]

[tool.setuptools]
packages = []
